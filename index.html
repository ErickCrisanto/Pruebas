history.pushState({a:1},'');onpopstate=function(){history.pushState({a:1},'');if(conn&&conn.open)conn.send({t:'pick',id:play?'pause':'back'})};

var hd=$('#hd'),stk=$('#stk'),kn=$('#kn'),lid=null,cid=null,fid=null,drag=null,dk='',ids={},ox=0,oy=0,px=0,py=0,fx=0,fy=0,R=60;

else if(k==='a'){st.a^=1;b.classList.toggle('on',!!st.a)}

else if(cid===null){cid=t.identifier;px=t.clientX;py=t.clientY}}},{passive:false});

for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];
if(t.identifier===drag){var x=cl(t.clientX/innerWidth*100,4,96),y=cl(t.clientY/innerHeight*100,8,92);C.pos[dk]=[x,y];$('#'+dk).style.left=x+'%';$('#'+dk).style.top=y+'%'}

}
